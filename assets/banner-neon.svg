<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="neon" x1="80" y1="60" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g opacity="0.22" stroke="url(#neon)">
    <path d="M40 70H1240" />
    <path d="M40 120H1240" />
    <path d="M40 170H1240" />
    <path d="M40 220H1240" />
    <path d="M40 270H1240" />
  </g>

  <rect x="58" y="44" width="1160" height="232" rx="18" stroke="url(#neon)" stroke-opacity="0.65"/>

  <g filter="url(#glow)">
    <text x="88" y="128" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial" font-size="60" font-weight="800">Titan ⚙️</text>
    <text x="90" y="176" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial" font-size="26" font-weight="700">coderxautomation</text>
    <text x="88" y="230" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial" font-size="30" font-weight="500">AI Automation Engineer • Product Builder • Rapid Deployer</text>
  </g>

  <circle cx="1090" cy="90" r="6" fill="#22D3EE">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="1120" cy="90" r="6" fill="#A78BFA">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="1150" cy="90" r="6" fill="#60A5FA">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.3s" repeatCount="indefinite" />
  </circle>
</svg>
